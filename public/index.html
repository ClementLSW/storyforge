<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryForge MVP</title><style>body{font:16px/1.6 system-ui;background:#11151d;color:#eee;max-width:850px;margin:32px auto;padding:20px}h1{color:#e6c78e}input,textarea,button{font:inherit;padding:12px;border-radius:8px;box-sizing:border-box}input,textarea{width:100%;background:#202632;color:white;margin:8px 0 15px}button{background:#d5ae6e;cursor:pointer}article,pre{background:#1b222e;padding:16px;border-radius:8px;white-space:pre-wrap}#game{display:none}</style></head><body><h1>StoryForge</h1><section id="setup"><h2>New campaign</h2><input id="title" value="The Ashen Crown" aria-label="Title"><textarea id="premise" rows="5" aria-label="Premise">A crumbling fantasy kingdom where the royal heir has disappeared and ancient magic is returning. You are an investigator arriving in the capital.</textarea><button id="create">Create campaign</button></section><section id="game"><h2 id="heading"></h2><div id="story"></div><form id="turn"><textarea id="action" rows="3" required placeholder="What do you do?"></textarea><button id="submit">Take action</button></form><h3>World state</h3><pre id="state"></pre></section><p id="error" role="alert"></p><script>
const $=id=>document.getElementById(id);let id=new URLSearchParams(location.search).get('campaign');
async function api(path,options){const r=await fetch(path,options);const j=await r.json();if(!r.ok)throw Error(j.error||JSON.stringify(j));return j}
function add(action,narration){const el=document.createElement('article');const strong=document.createElement('strong');strong.textContent='You: '+action;const p=document.createElement('p');p.textContent=narration;el.append(strong,p);$('story').append(el)}
async function load(){if(!id)return;const c=await api('/api/campaigns/'+id);$('setup').style.display='none';$('game').style.display='block';$('heading').textContent=c.title;$('story').replaceChildren();for(const t of c.turns)add(t.player_action,t.narration);$('state').textContent=JSON.stringify(c.state,null,2)}
function show(e){$('error').textContent=e.message||String(e)}
$('create').onclick=async()=>{try{$('create').disabled=true;const c=await api('/api/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:$('title').value,premise:$('premise').value})});id=c.id;history.replaceState(null,'','?campaign='+id);await load()}catch(e){show(e)}finally{$('create').disabled=false}};
$('turn').onsubmit=async e=>{e.preventDefault();try{$('submit').disabled=true;const action=$('action').value;const result=await api('/api/campaigns/'+id+'/turns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});add(action,result.turn.narration);$('state').textContent=JSON.stringify(result.state,null,2);$('action').value=''}catch(e){show(e)}finally{$('submit').disabled=false}};
load().catch(show);
</script></body></html>
